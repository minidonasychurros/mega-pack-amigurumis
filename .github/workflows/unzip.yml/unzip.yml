name: Descomprimir archivos del sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer ZIP si existe
        run: |
          if [ ! -f hosting-directo.zip ]; then echo "No hay ZIP, nada que hacer"; exit 0; fi
          unzip -o hosting-directo.zip
          rm hosting-directo.zip
          if [ ! -f index.html ]; then
            for d in */; do
              if [ -f "${d}index.html" ]; then mv "${d}"* .; fi
            done
          fi
          ls -la
      - name: Confirmar archivos extraidos
        run: |
          git config user.name "minidonasychurros"
          git config user.email "minidonasychurros@gmail.com"
          git add -A
          git diff --cached --quiet && echo "Sin cambios" || (git commit -m "Extraer archivos del sitio desde hosting-directo.zip" && git push)
